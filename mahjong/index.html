<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>麻雀点数管理</title>

  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
    <h1>麻雀点数管理</h1>
    
    <div class="game-info">
  <h2 id="round">東1局</h2>

  <p id="honba">0本場</p>

  <p id="kyotaku">供託: 0</p>
</div>

    <div class="player">
      <h2>プレイヤーA</h2>
      <p id="score0">25000</p>

      <button onclick = "win(0)">A和了 </button>
    </div>
    <div class="player">
      <h2>プレイヤーB</h2>
      <p id="score1">25000</p>

      <button onclick = "win(1)">B和了 </button>
    </div>

<div class="player">
  <h2>プレイヤーC</h2>
  <p id="score2">25000</p>

  <button onclick = "win(2)">C和了 </button>
</div>

<div class="player">
  <h2>プレイヤーD</h2>
  <p id="score3">25000</p>

  <button onclick = "win(3)">D和了 </button>
</div>
<div id="winMenu" class="hidden">

  <h2>和了入力</h2>

  <p>和了タイプ</p>

  <button onclick="setType('t')">ツモ</button>
  <button onclick="setType('r')">ロン</button>

  <p>翻数</p>

  <button onclick="setHan(1)">1翻</button>
  <button onclick="setHan(2)">2翻</button>
  <button onclick="setHan(3)">3翻</button>
  <button onclick="setHan(4)">4翻</button>

  <p>符数</p>

  <button onclick="setFu(20)">20符</button>
  <button onclick="setFu(30)">30符</button>
  <button onclick="setFu(40)">40符</button>
  <button onclick="setFu(50)">50符</button>

  <div id="ronSelect" class="hidden">

    <p>放銃者</p>

    <button onclick="setLoser(0)">A</button>
    <button onclick="setLoser(1)">B</button>
    <button onclick="setLoser(2)">C</button>
    <button onclick="setLoser(3)">D</button>

  </div>

  <button onclick="confirmWin()">確定</button>

</div>
<script src="script.js?v=1"></script>
</body>
</html>
