<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>麻雀点数管理</title>

  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <h1>麻雀点数管理</h1>
    
    <div class="game-info">
  <h2 id="round">東1局</h2>

  <p id="honba">0本場</p>

  <p id="kyotaku">供託: 0</p>
</div>

    <div class="player">
      <h2>プレイヤーA</h2>
      <p id="score0">25000</p>

      <button onclick = "win(0)">A和了 </button>
    </div>
    <div class="player">
      <h2>プレイヤーB</h2>
      <p id="score1">25000</p>

      <button onclick = "win(1)">B和了 </button>
    </div>

<div class="player">
  <h2>プレイヤーC</h2>
  <p id="score2">25000</p>

  <button onclick = "win(2)">C和了 </button>
</div>

<div class="player">
  <h2>プレイヤーD</h2>
  <p id="score3">25000</p>

  <button onclick = "win(3)">D和了 </button>
</div>
<div id="winMenu" class="hidden">

  <h2>和了入力</h2>

  <p>和了タイプ</p>

  <button id="type-t" onclick="setType('t')">ツモ</button>
  <button id="type-r" onclick="setType('r')">ロン</button>

  <p>翻数</p>

  <button id="han-1" onclick="setHan(1)">1翻</button>
  <button id="han-2" onclick="setHan(2)">2翻</button>
  <button id="han-3" onclick="setHan(3)">3翻</button>
  <button id="han-4" onclick="setHan(4)">4翻</button>

  <p>符数</p>
   
  <button id="fu-20" onclick="setFu(20)">20符</button>
  <button id="fu-30" onclick="setFu(30)">30符</button>
  <button id="fu-40" onclick="setFu(40)">40符</button>
  <button id="fu-50" onclick="setFu(50)">50符</button>

  <div id="ronSelect" class="hidden">

  <p>放銃者</p>

  <button id="loser-0" onclick="setLoser(0)">A</button>
  <button id="loser-1" onclick="setLoser(1)">B</button>
  <button id="loser-2" onclick="setLoser(2)">C</button>
  <button id="loser-3" onclick="setLoser(3)">D</button>

  </div>

  <button onclick="confirmWin()">確定</button>
</div>
  <div id="result" class="hidden">

  <h2>清算画面</h2>

  <div class="settlement-row">
    <span class="name">A</span>
    <span id="finalScore0" class="score">25000</span>
    <span id="diff0" class="diff">+0</span>
  </div>

  <div class="settlement-row">
    <span class="name">B</span>
    <span id="finalScore1" class="score">25000</span>
    <span id="diff1" class="diff">+0</span>
  </div>

  <div class="settlement-row">
    <span class="name">C</span>
    <span id="finalScore2" class="score">25000</span>
    <span id="diff2" class="diff">+0</span>
  </div>

  <div class="settlement-row">
    <span class="name">D</span>
    <span id="finalScore3" class="score">25000</span>
    <span id="diff3" class="diff">+0</span>
  </div>

  <button onclick="Settlement()">清算</button>

</div>




<script type="module" src="./js/main.js"></script>
</body>
</html>
